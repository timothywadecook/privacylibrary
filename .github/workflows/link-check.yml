name: Link check

# Validates that relative links between Markdown files resolve. Runs offline
# (no external network requests) so it's fast and non-flaky — it catches the
# broken internal links and moved anchors that a cross-referenced standard
# accumulates, without depending on third-party sites being up.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress --include-fragments './**/*.md'"
          fail: true
